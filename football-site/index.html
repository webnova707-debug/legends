<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Football Stars</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }
      header {
        text-align: center;
        padding: 70px 20px 40px;
      }
      header h1 {
        margin: 0 0 10px;
        font-size: 44px;
        letter-spacing: 1px;
        color: white;
      }
      header p {
        margin: 0;
        color: #94a3b8;
        font-size: 18px;
      }
      .grid {
        max-width: 1000px;
        margin: 0 auto;
        padding: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 28px;
      }
      .card {
        background: #1e293b;
        border-radius: 18px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card:hover {
        transform: translateY(-8px);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .photo {
        position: relative;
        height: 300px;
        overflow: hidden;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .initials {
        font-size: 64px;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.85);
      }
      .photo img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
      }
      .card:hover .photo img {
        transform: scale(1.1);
      }
      .info {
        padding: 20px;
      }
      .info h2 {
        margin: 0 0 6px;
        color: white;
        font-size: 22px;
      }
      .info p {
        margin: 0;
        color: #94a3b8;
      }
      .tap {
        display: inline-block;
        margin-top: 12px;
        font-size: 14px;
        color: #60a5fa;
      }

      /* Pop-up */
      .overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(2, 6, 23, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .overlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      .popup {
        position: relative;
        background: #1e293b;
        border-radius: 20px;
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        transform: scale(0.9);
        transition: transform 0.3s ease;
      }
      .overlay.show .popup {
        transform: scale(1);
      }
      .popup .photo {
        height: 340px;
      }
      .popup .info {
        padding: 24px;
      }
      .section-title {
        margin: 22px 0 8px;
        font-size: 13px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #60a5fa;
      }
      .bio p {
        margin: 0 0 12px;
        line-height: 1.7;
        color: #cbd5e1;
      }
      .popup ul {
        padding-left: 20px;
        margin: 0;
        line-height: 1.8;
        color: #cbd5e1;
      }
      .close {
        position: absolute;
        top: 12px;
        right: 12px;
        z-index: 2;
        width: 38px;
        height: 38px;
        border: none;
        border-radius: 50%;
        background: rgba(15, 23, 42, 0.8);
        color: white;
        font-size: 20px;
        cursor: pointer;
      }
      footer {
        text-align: center;
        padding: 40px 20px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Football Stars</h1>
      <p>Click a player to learn more</p>
    </header>

    <div class="grid" id="grid"></div>

    <div class="overlay" id="overlay" onclick="closePopup(event)">
      <div class="popup" id="popup"></div>
    </div>

    <footer>Made by Prem</footer>

    <script>
      const players = [
        {
          name: "Lionel Messi",
          initials: "LM",
          image: "images/messi.jpg",
          short: "Forward - Argentina",
          bio: [
            "the boy who made dreams eternal. 🐐",
            "the art of football, written in gold. 🐐𖤐 10 • a legend beyond time."
          ],
          details: [
            "Born: 24 June 1987, Rosario, Argentina",
            "Position: Forward / attacking midfielder",
            "Won the FIFA World Cup in 2022 with Argentina",
            "Has won the Ballon d'Or 8 times"
          ]
        },
        {
          name: "Cristiano Ronaldo",
          initials: "CR",
          image: "images/ronaldo.jpg",
          short: "Forward - Portugal",
          bio: [
            "built from pain, crowned by greatness. 🐐",
            "destined for greatness, built to conquer. 🐐𖤐 7 • the name speaks for itself."
          ],
          details: [
            "Born: 5 February 1985, Funchal, Portugal",
            "Position: Forward",
            "Won the European Championship in 2016 with Portugal",
            "Has won the Ballon d'Or 5 times"
          ]
        },
        {
          name: "Neymar Jr",
          initials: "NJ",
          image: "images/neymar.jpg",
          short: "Forward - Brazil",
          bio: [
            "born to dance, destined to dazzle. 🥀",
            "a little samba, a lot of magic. 🥀𖤐 11 • born to be unforgettable."
          ],
          details: [
            "Born: 5 February 1992, Mogi das Cruzes, Brazil",
            "Position: Forward / winger",
            "Won the Olympic gold medal in 2016 with Brazil",
            "Won the UEFA Champions League in 2015 with Barcelona"
          ]
        }
      ];

      function photoHtml(player) {
        return '<div class="photo"><span class="initials">' + player.initials + '</span>' +
          '<img src="' + player.image + '" alt="' + player.name + '" onerror="this.style.display=\'none\'"></div>';
      }

      function drawCards() {
        let html = "";
        for (let i = 0; i < players.length; i++) {
          const p = players[i];
          html += '<div class="card" onclick="openPopup(' + i + ')">' +
            photoHtml(p) +
            '<div class="info"><h2>' + p.name + '</h2><p>' + p.short + '</p>' +
            '<span class="tap">View details</span></div></div>';
        }
        document.getElementById("grid").innerHTML = html;
      }

      function openPopup(index) {
        const p = players[index];

        let bioHtml = "";
        for (let i = 0; i < p.bio.length; i++) {
          bioHtml += "<p>" + p.bio[i] + "</p>";
        }

        let list = "";
        for (let i = 0; i < p.details.length; i++) {
          list += "<li>" + p.details[i] + "</li>";
        }

        document.getElementById("popup").innerHTML =
          '<button class="close" onclick="closePopup()">&times;</button>' +
          photoHtml(p) +
          '<div class="info"><h2>' + p.name + '</h2><p>' + p.short + '</p>' +
          '<div class="section-title">About</div><div class="bio">' + bioHtml + '</div>' +
          '<div class="section-title">Quick facts</div><ul>' + list + '</ul></div>';

        document.getElementById("overlay").classList.add("show");
      }

      function closePopup(event) {
        if (event && event.target.id !== "overlay") {
          return;
        }
        document.getElementById("overlay").classList.remove("show");
      }

      document.addEventListener("keydown", function (e) {
        if (e.key === "Escape") {
          document.getElementById("overlay").classList.remove("show");
        }
      });

      drawCards();
    </script>
  </body>
</html>
